[package]
name = "omnia-wasi-otel"
description = "WASI OpenTelemetry interface for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
futures.workspace = true
hex = "0.4.3"
omnia-core.workspace = true
omnia-wasi-types.workspace = true
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry-proto.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
wasmtime.workspace = true

[dev-dependencies]
omnia = { path = "../omnia" }
omnia-test = { path = "../test", default-features = false, features = ["host"] }
omnia-wasi-messaging = { path = "../wasi-messaging" }
omnia-wasi-websocket = { path = "../wasi-websocket" }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tonic = { workspace = true, features = ["codegen", "router", "server"] }
