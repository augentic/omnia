[package]
name = "omnia-wasi-otel"
description = "WASI OpenTelemetry interface for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true

# host dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures.workspace = true
hex = "0.4.3"
omnia-core.workspace = true
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry-proto.workspace = true
opentelemetry_sdk.workspace = true
tracing-opentelemetry.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true

# guest dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest-macros.workspace = true
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
    "trace",
] }
tracing-opentelemetry = { workspace = true, features = ["metrics"] }
tracing-subscriber.workspace = true
wit-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
