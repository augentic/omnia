[package]
name = "omnia-sdk"
description = "SDK for building WASI component applications with Omnia runtime support"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = ["http"]

# Enables the axum-backed `api::http` handler support and the `mcp` server.
# The outbound `http` helpers and `Error::status()` need no feature.
http = ["dep:axum", "dep:tower"]

# Enables the clap-backed `api::command` façade (argv parsing, `--format`,
# shell completions).
command = ["dep:clap", "dep:clap_complete"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["json", "matched-path", "query"], optional = true }
bon.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["string"], optional = true }
clap_complete = { workspace = true, optional = true }
futures.workspace = true
getrandom.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
omnia-guest-macros.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tower = { workspace = true, optional = true }
tracing.workspace = true
wasip3.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
tracing-opentelemetry = { workspace = true, features = ["metrics"] }
tracing-subscriber = { workspace = true, features = ["ansi"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber.workspace = true
