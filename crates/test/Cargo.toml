[package]
name = "omnia-test"
description = "Test doubles, runtime harness, and wasm fixture pipeline for omnia-based code"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# No default: a consumer names the rung it uses, and a build-dependency line
# that forgets `default-features = false` still pulls nothing but `std`.
default = []
# Cross-provider contract conformance scenarios and the `conformance!` macro.
conformance = [
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:omnia-sdk",
    "omnia-sdk/sql",
    "omnia-sdk/docstore",
    "dep:tokio",
]
# Wasmtime-free `*Client` doubles (`ScriptedModel`, `ScriptedVcs`).
backend = [
    "dep:anyhow",
    "dep:futures",
    "dep:omnia-backend",
    "omnia-backend/model",
    "omnia-backend/vcs",
]
# Native doubles for the `omnia_sdk` capability traits, plus the `Provider` that bundles them.
# `omnia-sdk/sql` and `omnia-sdk/docstore` carry the `TableStore` and
# `DocumentStore` traits the `ScriptedTables` and `MemoryDocs` doubles implement.
guest = [
    "backend",
    "conformance",
    "dep:anyhow",
    "dep:bytes",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:omnia-backend",
    "omnia-backend/docstore",
    "omnia-backend/keyvalue",
    "omnia-backend/model",
    "omnia-backend/vcs",
    "dep:omnia-sdk",
    "omnia-sdk/sql",
    "omnia-sdk/docstore",
]
# The component runtime harness: `Deployment`, `Backends`, `ScriptedModel`, `ScriptedVcs`, `Scratch`.
host = [
    "backend",
    "conformance",
    "dep:anyhow",
    "dep:futures",
    "dep:omnia",
    "omnia/loader",
    "omnia/link",
    "dep:omnia-backend",
    "omnia-backend/keyvalue",
    "omnia-backend/model",
    "omnia-backend/vcs",
    "dep:omnia-wasi-blobstore",
    "dep:omnia-wasi-config",
    "dep:omnia-wasi-docstore",
    "dep:omnia-wasi-http",
    "dep:omnia-wasi-identity",
    "dep:omnia-wasi-keyvalue",
    "dep:omnia-wasi-messaging",
    "dep:omnia-wasi-model",
    "dep:omnia-wasi-otel",
    "dep:omnia-wasi-sql",
    "dep:omnia-wasi-vault",
    "dep:omnia-wasi-vcs",
    "dep:omnia-wasi-websocket",
    "dep:tempfile",
]
# The std-only wasm32 fixture pipeline for a consumer's `build.rs`.
build = []

# Every dependency is optional so `--no-default-features --features build`
# resolves to `std` alone on a consumer's build-dependency line.
[dependencies]
anyhow = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
omnia = { workspace = true, optional = true }
omnia-backend = { workspace = true, optional = true }
omnia-sdk = { workspace = true, optional = true }
omnia-wasi-blobstore = { workspace = true, optional = true }
omnia-wasi-config = { workspace = true, optional = true }
omnia-wasi-docstore = { workspace = true, optional = true }
omnia-wasi-http = { workspace = true, optional = true }
omnia-wasi-identity = { workspace = true, optional = true }
omnia-wasi-keyvalue = { workspace = true, optional = true }
omnia-wasi-messaging = { workspace = true, optional = true }
omnia-wasi-model = { workspace = true, optional = true }
omnia-wasi-otel = { workspace = true, optional = true }
omnia-wasi-sql = { workspace = true, optional = true }
omnia-wasi-vault = { workspace = true, optional = true }
omnia-wasi-vcs = { workspace = true, optional = true }
omnia-wasi-websocket = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
omnia = { path = "../omnia" }
omnia-sdk = { path = "../omnia-sdk", default-features = false }
omnia-wasi-blobstore = { path = "../wasi-blobstore" }
omnia-wasi-config = { path = "../wasi-config" }
omnia-wasi-keyvalue = { path = "../wasi-keyvalue" }
omnia-wasi-model = { path = "../wasi-model" }
omnia-wasi-otel = { path = "../wasi-otel" }
omnia-wasi-sql = { path = "../wasi-sql" }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[[test]]
name = "script"

[[test]]
name = "guest_scripted"
required-features = ["guest"]

[[test]]
name = "guest_stores"
required-features = ["guest"]

[[test]]
name = "provider"
required-features = ["guest"]

[[test]]
name = "conformance"
required-features = ["guest"]

[[test]]
name = "host"
required-features = ["host"]

[[test]]
name = "command"
required-features = ["host"]

[[test]]
name = "cli"
required-features = ["host"]
