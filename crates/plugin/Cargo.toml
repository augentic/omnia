[package]
name = "omnia-plugin"
description = "The omnia:plugins/loader capability for the omnia runtime: the loader host, acquisition policies, and plugin stores"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

# host dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
cap-std.workspace = true
futures.workspace = true
http-auth.workspace = true
omnia-core.workspace = true
omnia-wasi-types.workspace = true
# `rustls-no-provider`, as in `omnia-wasi-http`: a fetch from a registry a
# load names installs `ring` as the process provider before it builds a client.
reqwest = { workspace = true, features = ["rustls-no-provider", "system-proxy"] }
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "rt"] }
tracing.workspace = true
wasm-pkg-client.workspace = true
wasmtime = { workspace = true, features = ["runtime"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The loopback registry the suites fetch from.
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
omnia = { path = "../omnia", features = ["loader", "link"] }
omnia-test = { path = "../test", default-features = false, features = ["host"] }
omnia-wasi-otel = { path = "../wasi-otel" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
