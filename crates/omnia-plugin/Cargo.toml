[package]
name = "omnia-plugin"
description = "The omnia:plugins/loader capability for the omnia runtime: the loader host, acquisition policies, and plugin stores"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
cap-std.workspace = true
futures.workspace = true
omnia-core.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
wasm-pkg-client.workspace = true
wasmtime = { workspace = true, features = ["runtime"] }

[dev-dependencies]
# Path-only (stripped at publish): the e2e loader tests exercise the embedder
# surface, so they import through the `omnia` facade.
omnia = { path = "../omnia" }
tempfile.workspace = true
test-utils.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
