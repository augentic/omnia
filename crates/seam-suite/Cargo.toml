[package]
name = "omnia-seam-suite"
description = "Guest–host seam tests for the Omnia workspace"
publish = false
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

# One auto-discovered integration-test target per scenario family; Nextest
# runs them process-per-test with the rest of the workspace. Build the guest
# artifacts first: `cargo make test-guests` (`cargo make test` does both).

[dev-dependencies]
anyhow.workspace = true
futures.workspace = true
omnia.workspace = true
omnia-testkit.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-messaging.workspace = true
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
omnia-wasi-websocket.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite.workspace = true
wasmtime-wasi.workspace = true
wiremock = "0.6.5"
