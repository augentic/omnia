[package]
name = "omnia-wasi-http"
description = "WASI HTTP interface implementation for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
http.workspace = true
tracing.workspace = true

# host dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64ct.workspace = true
fromenv.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
# `rustls-no-provider` keeps TLS (and `Identity::from_pem`) without reqwest's
# default `aws-lc-sys` provider — `ring` comes from the explicit rustls
# dependency below. The default backend installs ring as the process provider
# before building a client (see `host/default_impl.rs`).
reqwest = { workspace = true, features = ["http2", "rustls-no-provider", "stream", "system-proxy"] }
rustls.workspace = true
tokio = { workspace = true, features = ["time"] }
wasmtime = { workspace = true, features = ["component-model-async"] }
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
omnia-core.workspace = true

# guest dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
axum.workspace = true
http-body.workspace = true
serde.workspace = true
serde_json.workspace = true
tower.workspace = true
wasip3.workspace = true
omnia-wasi-keyvalue.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The loopback origin the outgoing suite serves; `hyper` itself is a host
# dependency above, only its server side is test-only.
hyper = { workspace = true, features = ["http1", "server"] }
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-config.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-otel.workspace = true
serde_json.workspace = true
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt"] }
