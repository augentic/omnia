[package]
name = "omnia-native"
description = "In-process bridge from Omnia SDK capabilities to service contracts, plus native server drivers"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["telemetry"]

# Enables `Serve::telemetry` and process OpenTelemetry initialization/flushing.
telemetry = ["omnia-backend/otel-default"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
omnia-backend = { workspace = true, default-features = false, features = [
    "blobstore",
    "config",
    "docstore",
    "http",
    "identity",
    "keyvalue",
    "messaging",
    "model",
    "sql",
    "vault",
    "vcs",
    "websocket",
] }
omnia-sdk = { workspace = true, default-features = false, features = [
    "docstore",
    "http",
    "sql",
] }
tokio = { workspace = true, features = ["net", "rt", "signal", "sync"] }
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia-backend = { workspace = true, default-features = false, features = [
    "defaults",
    "oauth",
    "sqlite",
] }
omnia-test = { path = "../omnia-test", default-features = false, features = ["backend", "conformance"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
