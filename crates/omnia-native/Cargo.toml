[package]
name = "omnia-native"
description = "In-process bridge from Omnia SDK capabilities to service contracts, plus native server drivers"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
omnia-backend = { workspace = true, default-features = false, features = [
    "blobstore",
    "config",
    "docstore",
    "http",
    "identity",
    "keyvalue",
    "messaging",
    "model",
    "otel",
    "sql",
    "vault",
    "vcs",
    "websocket",
] }
omnia-sdk = { workspace = true, default-features = false, features = [
    "docstore",
    "http",
    "sql",
] }
tokio = { workspace = true, features = ["net", "rt", "sync"] }
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia = { path = "../omnia" }
omnia-backend = { workspace = true, default-features = false, features = [
    "defaults",
    "oauth",
    "sqlite",
] }
omnia-test = { path = "../omnia-test", default-features = false, features = ["host"] }
omnia-wasi-blobstore = { path = "../wasi-blobstore" }
omnia-wasi-config = { path = "../wasi-config" }
omnia-wasi-docstore = { path = "../wasi-docstore" }
omnia-wasi-http = { path = "../wasi-http" }
omnia-wasi-identity = { path = "../wasi-identity" }
omnia-wasi-keyvalue = { path = "../wasi-keyvalue" }
omnia-wasi-messaging = { path = "../wasi-messaging" }
omnia-wasi-model = { path = "../wasi-model" }
omnia-wasi-otel = { path = "../wasi-otel" }
omnia-wasi-sql = { path = "../wasi-sql" }
omnia-wasi-vault = { path = "../wasi-vault" }
omnia-wasi-vcs = { path = "../wasi-vcs" }
omnia-wasi-websocket = { path = "../wasi-websocket" }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
