[package]
name = "test-artifacts"
description = "The compiled guest components the e2e test suites drive, as path constants"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

# The crate is `build.rs` plus the `gen.rs` it writes: no runtime
# dependencies. A suite drives the artifacts through `omnia_test::host`.
[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }
