[package]
name = "test-programs"
description = "Guest scenario programs driven by the e2e test suites, and their compiled artifacts"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
autoexamples = false

# The guest side: `build.rs` (through `omnia_test::build`) compiles every
# `programs/<capability>/<scenario>.rs` as an `[[example]]` cdylib for
# `wasm32-wasip3`. The native side has no dependencies: it is the generated
# artifact paths alone.
[target.'cfg(target_arch = "wasm32")'.dependencies]
axum = { workspace = true, features = ["query"] }
bytes.workspace = true
clap.workspace = true
futures.workspace = true
http.workspace = true
omnia-sdk = { workspace = true, features = ["command", "http"] }
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

# The contract rows run in the programs alone, never in the lib.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
omnia-test = { workspace = true, features = ["contract"] }

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

[lints]

# Generated by build.rs from programs/<group>/<scenario>.rs.

