[package]
name = "test-programs"
description = "Guest scenario programs driven by the e2e test suites"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

# Guest-only crate: `test-utils`'s build script compiles every `[[example]]`
# below for `wasm32-wasip2`; the native build is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest.workspace = true
omnia-wasi-model.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[[example]]
name = "model_answer_rejected"
path = "programs/model_answer_rejected.rs"
crate-type = ["cdylib"]

