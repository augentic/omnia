[package]
name = "omnia"
description = "Ergonomic WebAssembly component runtime built on wasmtime with pluggable WASI host services"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["cli", "jit", "otlp"]

# Enables the standard `omnia run` CLI grammar in generated `main`s and the
# `clap` re-export. Without it, deployments are direct commands (command mode
# with a compiled-in deployment) or built programmatically via
# `DeploymentBuilder`.
cli = ["dep:omnia-cli"]

# Enables the guest loader (`omnia:plugins/loader`): the `WasiPlugins` host,
# the `Plugins` load path over the manifest's `on_demand` guests, and the
# `RegistryClient` with its HTTP/OCI registry stack. With it, assembly links
# the loader host beside WASI — reachable only from worlds that import it —
# and installs the on-demand table routed by the deployment's `registries`;
# without it, a manifest declaring `registries` or an `on_demand` guest is
# refused at startup.
loader = ["dep:omnia-plugin"]

# Enables guest→guest dispatch (the `omnia-link` crate): every import a guest
# makes outside the runtime's own namespaces (`wasi:`, `omnia:`) is relayed to
# the guest exporting it. Without it, such an import is unresolved and the
# deployment fails at boot.
link = ["dep:omnia-link"]

# Enables just-in-time wasm to machine code compilation.
jit = ["omnia-core/jit", "omnia-cli?/jit"]

# Enables the OTLP (gRPC) span and metric exporters. Without it, `Telemetry`
# still installs the fmt/`EnvFilter` subscriber, while `telemetry::flush` and
# `telemetry::resource` become no-ops.
otlp = ["omnia-core/otlp"]

# Enables memory protection keys (MPK) support in the pooling allocator. MPK
# only functions on Linux/x86_64; elsewhere it compiles but is inert
# (`POOL_MEMORY_PROTECTION_KEYS=auto` falls back to leaving guard regions in
# place). Off by default.
mpk = ["omnia-core/mpk"]

# Enables the WebAssembly GC / reference-types proposal (with the default
# copying collector) and the pooling allocator's `total_gc_heaps` control
# (`POOL_TOTAL_GC_HEAPS`). Current guests compile to linear memory and never
# allocate a GC heap, so this is off by default.
gc = ["omnia-core/gc"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
futures.workspace = true
omnia-cli = { workspace = true, optional = true }
omnia-core.workspace = true
omnia-host-macros.workspace = true
omnia-link = { workspace = true, optional = true }
omnia-plugin = { workspace = true, optional = true }
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
toml.workspace = true
tracing.workspace = true
wasmtime = { workspace = true, features = ["runtime"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "link"
required-features = ["link"]
