[package]
name = "omnia"
description = "Ergonomic WebAssembly component runtime built on wasmtime with pluggable WASI host services"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["jit"]

# Enables the guest loader (`omnia:plugins/loader`): the `WasiPlugins` host,
# the `Plugins` load path over the runtime's first-use seam, and the
# `RegistryClient` with its HTTP/OCI registry stack. With it, assembly links
# the loader host beside WASI — reachable only from worlds that import it —
# and fetches every `source.package` guest through the deployment's
# `registries` at its first use; without it, a manifest declaring
# `registries` or a package source is refused at startup. A loaded guest is
# raw wasm or `omnia compile` output; compiling the former needs `jit`.
loader = ["dep:omnia-plugin"]

# Enables guest→guest dispatch (the `omnia-link` crate): every import a guest
# makes outside the runtime's own namespaces (`wasi:`, `omnia:`) is relayed to
# the guest exporting it. Without it, such an import is unresolved and the
# deployment fails at boot.
link = ["dep:omnia-link"]

# Enables just-in-time wasm to machine code compilation. Raw `.wasm` guests
# and `omnia::compile` exist only with it; without it every guest, at boot or
# at first use, is a pre-compiled `omnia compile` artifact.
jit = ["omnia-compile/cranelift", "omnia-core/jit"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
futures.workspace = true
omnia-cli.workspace = true
omnia-compile.workspace = true
omnia-core.workspace = true
omnia-host-macros.workspace = true
omnia-link = { workspace = true, optional = true }
omnia-plugin = { workspace = true, optional = true }
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }
toml.workspace = true
tracing.workspace = true
wasmtime = { workspace = true, features = ["pooling-allocator", "runtime"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[[test]]
name = "link"
required-features = ["link", "jit"]

[[test]]
name = "runtime"
required-features = ["jit", "loader"]
