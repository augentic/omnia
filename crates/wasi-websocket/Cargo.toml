[package]
name = "omnia-wasi-websocket"
description = "WASI WebSocket interface for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
dashmap.workspace = true
futures.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
getrandom.workspace = true
omnia-core.workspace = true
omnia-wasi-types.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
wasmtime = { workspace = true, features = ["component-model-async"] }

[dev-dependencies]
omnia = { path = "../omnia" }
omnia-test = { path = "../test", default-features = false, features = ["host"] }
omnia-wasi-otel = { path = "../wasi-otel" }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
