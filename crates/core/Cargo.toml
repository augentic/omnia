[package]
name = "omnia-core"
description = "Runtime core of the omnia WebAssembly component runtime: deployment, registry, dispatch, and the capability-crate seam"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["jit"]

# Enables just-in-time wasm to machine code compilation: the Cranelift
# backend `omnia-compile` carries, which `Component::new` over raw wasm needs.
jit = ["omnia-compile/cranelift"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
futures.workspace = true
http.workspace = true
log.workspace = true
omnia-compile.workspace = true
omnia-host-macros.workspace = true
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["metrics", "trace"] }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, features = ["metrics"] }
tracing-subscriber = { workspace = true, features = ["ansi", "smallvec"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
wasmtime = { workspace = true, features = ["pooling-allocator", "runtime"] }
wasmtime-wasi.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
