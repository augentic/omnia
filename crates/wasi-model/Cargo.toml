[package]
name = "omnia-wasi-model"
description = "WASI model completion interface (the omnia:model boundary) for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
cap-std.workspace = true
fromenv.workspace = true
futures.workspace = true
omnia-core.workspace = true
omnia-wasi-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
# `component-model-async` for `StreamReader`/`FutureReader`
# belongs on the direct dependency.
wasmtime = { workspace = true, features = ["component-model-async"] }
wasmtime-wasi.workspace = true

[dev-dependencies]
omnia.workspace = true
omnia-test = { workspace = true, default-features = false, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
