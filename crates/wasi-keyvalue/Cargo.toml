[package]
name = "omnia-wasi-keyvalue"
description = "WASI key-value store interface for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]

# The wasmtime host: `Host` for `WasiKeyValue` and the in-memory
# `KeyValueDefault`. Without it a native build carries the contract alone
# (`KeyValueClient`, `Bucket`, the `WasiKeyValue` marker), engine-free.
host = ["dep:futures", "dep:moka", "dep:omnia-core", "dep:wasmtime", "dep:wasmtime-wasi"]

# dependencies shared across host and guest
[dependencies]
anyhow.workspace = true
tracing.workspace = true

# contract and host dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
omnia-backend.workspace = true
omnia-core = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

# guest dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia = { path = "../omnia" }
omnia-test = { path = "../test", default-features = false, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
