[package]
name = "omnia-backend"
description = "Engine-free service contracts and value types for Omnia capabilities"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []

blobstore = ["dep:bytes"]
config = []
docstore = ["dep:chrono", "dep:serde", "dep:serde_json"]
identity = []
messaging = ["dep:thiserror", "dep:tokio"]
model = [
    "dep:bon",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
]
otel = ["dep:opentelemetry-proto"]
plugins = ["dep:wasm-pkg-common"]
sql = []
vault = []
vcs = ["dep:cap-std", "dep:thiserror"]
websocket = []

[dependencies]
anyhow.workspace = true
bon = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }
futures.workspace = true
opentelemetry-proto = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"], optional = true }
wasm-pkg-common = { workspace = true, optional = true }
