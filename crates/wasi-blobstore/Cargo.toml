[package]
name = "omnia-wasi-blobstore"
description = "WASI blobstore interface implementation for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

# host dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
omnia-core.workspace = true
parking_lot.workspace = true
tracing.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true

# guest dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Path-only, not `workspace = true`: the workspace entries carry a `version`,
# which cargo keeps in the published manifest, and these crates depend back
# on this one, so a versioned dev-dep would make the first publish of a
# fresh version unresolvable. Path-only dev-deps are stripped on publish.
omnia = { path = "../omnia" }
omnia-test = { path = "../omnia-test", default-features = false, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
