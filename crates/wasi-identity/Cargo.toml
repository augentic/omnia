[package]
name = "omnia-wasi-identity"
description = "WASI identity and authentication interface for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["oauth"]

# Enables the OAuth2 client-credentials default backend (`IdentityDefault`).
# Without it the host surface and `IdentityStub` stay; disabling drops the
# `oauth2` crate and its bundled reqwest/TLS stack.
oauth = ["dep:oauth2"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
oauth2 = { version = "5.0.0", optional = true }
omnia-core.workspace = true
omnia-wasi-types.workspace = true
tracing.workspace = true
wasmtime = { workspace = true, features = ["component-model-async"] }

[dev-dependencies]
omnia = { path = "../omnia" }
omnia-test = { path = "../test", default-features = false, features = ["host"] }
omnia-wasi-otel = { path = "../wasi-otel" }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
