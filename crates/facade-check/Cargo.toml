[package]
name = "facade-check"
description = "Compile-only proof that a deployment needs no dependency beyond the omnia facade"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

# Deliberately minimal: the facade and one host crate. No `anyhow`, no
# `futures`, no `omnia-core`, no `omnia-plugin`. If the `runtime!` macro or a
# facade-exposed trait ever needs one of those from the embedder's own
# `Cargo.toml`, this crate stops compiling.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omnia.workspace = true
omnia-wasi-otel.workspace = true
