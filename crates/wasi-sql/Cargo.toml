[package]
name = "omnia-wasi-sql"
description = "WASI SQL database interface for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["sqlite"]

# Enables the bundled-SQLite default backend (`SqlDefault`). Without it the
# host surface stays; embedders supply their own `WasiSqlCtx`.
sqlite = ["dep:fromenv", "dep:futures", "dep:parking_lot", "dep:rusqlite", "dep:tokio"]

# host dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fromenv = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
omnia-core.workspace = true
parking_lot = { workspace = true, optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
wasmtime.workspace = true
wasmtime-wasi.workspace = true

# shared dependencies
[dependencies]
anyhow.workspace = true
tracing.workspace = true

# guest dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true
