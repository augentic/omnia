[package]
name = "omnia-wasi-sql"
description = "WASI SQL database interface for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["sqlite"]

# Enables the bundled-SQLite default backend (`SqlDefault`). Without it the
# host surface stays; embedders supply their own `SqlClient`.
sqlite = ["dep:futures", "dep:parking_lot", "dep:rusqlite"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures = { workspace = true, optional = true }
omnia-core.workspace = true
omnia-wasi-types.workspace = true
parking_lot = { workspace = true, optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"], optional = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
wasmtime = { workspace = true, features = ["component-model-async"] }

[dev-dependencies]
omnia.workspace = true
omnia-test = { workspace = true, default-features = false, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
