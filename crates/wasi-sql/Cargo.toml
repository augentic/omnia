[package]
name = "omnia-wasi-sql"
description = "WASI SQL database interface for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["sqlite"]

# Enables the bundled-SQLite default backend (`SqlDefault`). Without it the
# host surface stays; embedders supply their own `SqlClient`.
sqlite = ["omnia-backend/sqlite"]

# host dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omnia-core.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true

# shared dependencies
[dependencies]
anyhow.workspace = true
omnia-backend = { workspace = true, features = ["sql"] }
tracing.workspace = true

# guest dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia = { path = "../omnia" }
omnia-test = { path = "../omnia-test", default-features = false, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
