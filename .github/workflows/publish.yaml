name: Publish Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  skip:
    name: Skipped
    if: ${{ !startsWith(github.ref_name, 'release-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "This workflow only runs on the 'release-*' branches"
          exit 1

  ci:
    name: CI
    if: ${{ startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: read
    uses: augentic/toolkit/.github/workflows/ci.yaml@v0.5.0
    secrets: inherit
    with:
      targets: wasm32-wasip2

  publish:
    name: Publish
    needs: ci
    permissions:
      contents: write
    uses: augentic/toolkit/.github/workflows/publish.yaml@v0.5.0

  crates:
    name: Publish crates
    needs: publish
    permissions:
      contents: read
    uses: augentic/toolkit/.github/workflows/crates.yaml@v0.5.0
    secrets: inherit
