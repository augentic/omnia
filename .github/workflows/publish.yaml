name: Publish Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  skip:
    name: Skipped
    if: ${{ !startsWith(github.ref_name, 'release-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "This workflow only runs on the 'release-*' branches"
          exit 1

  ci:
    name: CI
    if: ${{ startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: read
    uses: augentic/toolkit/.github/workflows/ci.yaml@v0.7.0
    secrets: inherit
    with:
      targets: wasm32-wasip3
      # Mirrors `WASM32_PACKAGES` in mise.toml.
      wasm-packages: omnia-sdk omnia-guest-macros omnia-test test-programs examples

  publish:
    name: Publish
    needs: ci
    permissions:
      contents: write
    uses: augentic/toolkit/.github/workflows/publish.yaml@v0.7.0

  crates:
    name: Publish crates
    needs: publish
    permissions:
      contents: read
    uses: augentic/toolkit/.github/workflows/crates.yaml@v0.7.0
    secrets: inherit

  # Mirrors `wit-check`, then `wit-publish`, in mise.toml.
  wit:
    name: Publish WIT
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.publish.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.263.0,wkg@0.16.2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: scripts/wit.sh check
      - run: scripts/wit.sh publish
