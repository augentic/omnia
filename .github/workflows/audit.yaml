name: Audit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    uses: augentic/.github/.github/workflows/audit.yaml@v0.2.0
    with:
      # Mirrors `OUTDATED_IGNORE` in mise.toml.
      outdated: cap-fs-ext,cap-std,cap-primitives,thiserror
