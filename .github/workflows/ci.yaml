name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: augentic/toolkit/.github/workflows/ci.yaml@v0.7.0
    secrets: inherit
    with:
      targets: wasm32-wasip3
      wasm-packages: omnia-sdk omnia-guest-macros omnia-test test-programs examples

  # Mirrors `wit-verify` in mise.toml. A package starts private on ghcr.io, so
  # reading its releases takes a login.
  wit:
    name: WIT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: cargo xtask verify

