# Managed by augentic/toolkit from conventions/workflows/release.yaml and conventions.toml. Do not edit: run `make conventions-sync`.

name: Create Release

# Cut a durable release-X.Y.Z line from main: push release-<version> at the
# current tip, then open a pull request that bumps main to the next unreleased
# version and resets RELEASES.md.

on:
  workflow_dispatch:
    inputs:
      increment:
        description: The version bump for main after the cut; while on 0.x, minor marks a breaking change
        type: choice
        options: [minor, patch, major]
        default: minor

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: augentic/toolkit/.github/workflows/release.yaml@v0.3.0
    with:
      increment: ${{ inputs.increment }}
    secrets: inherit
