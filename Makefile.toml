# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

extend = [{ path = "examples/Makefile.toml" }]

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["audit", "fmt", "lint", "outdated", "deps"]

[tasks.ci]
dependencies = [
  "fmt",
  "lint",
  "hack",
  "test",
  "test-docs",
  "docs",
  "vet",
  "outdated",
  "deny",
]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Clean
[tasks.clean]
command = "cargo"
args = ["clean"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
script = '''
cargo +nightly udeps --all-targets
'''
install_crate = "cargo-udeps"
# args = ["machete", "--skip-target-dir"]
# install_crate = "cargo-machete"

# Every feature combination of the published test crate must build on its
# own, without dev-dependencies masking a missing `dep:` line.
[tasks.hack]
command = "cargo"
args = [
  "hack",
  "check",
  "--feature-powerset",
  "--exclude-features",
  "default",
  "--no-dev-deps",
  "-p",
  "omnia-test",
]
install_crate = "cargo-hack"

# Semver check against the last published omnia-test; joins `ci` once the
# first release exists as a baseline.
[tasks.semver]
command = "cargo"
args = ["semver-checks", "-p", "omnia-test", "--all-features"]
install_crate = "cargo-semver-checks"

# Fmt (fix in place)
[tasks.fmt]
script = "cargo +nightly fmt --all"

# Lint every line of code: natively, for `wasm32-wasip2`, and with features off.
[tasks.lint]
script = '''
cargo clippy --workspace --all-targets --all-features -- -D warnings
cargo clippy --workspace --all-targets --all-features --target wasm32-wasip2 -- -D warnings
cargo clippy -p omnia --no-default-features --all-targets -- -D warnings
'''
install_crate = { rustup_component_name = "clippy" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

[tasks.outdated]
script = '''
cargo outdated --workspace --exit-code 1 --depth 1 \
  --ignore cap-fs-ext --ignore cap-std --ignore cap-primitives \
  --ignore thiserror
'''
install_crate = "cargo-outdated"

[tasks.test]
command = "cargo"
args = ["nextest", "run", "--locked", "--all", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

[tasks.docs]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]

[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--all-features", "--workspace"]

# Vet
[tasks.vet]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
cargo vet --locked
'''
install_crate = "cargo-vet"

# Dry run of what the `Publish Release` workflow's crates job executes; the
# only pre-release check that every publishable member packages and verifies.
[tasks.publish]
command = "cargo"
args = ["publish", "--workspace", "--locked", "--dry-run"]
