[workspace]
members = ["crates/*", "examples"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
categories = ["wasm", "web-programming", "asynchronous"]
edition = "2024"
homepage = "https://augentic.io"
keywords = ["runtime", "wasi", "wasm", "wasmtime", "component-model"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/omnia"
rust-version = "1.99"
version = "0.37.0"

[workspace.lints.rust]
meta_variable_misuse = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# cherry-picked `restriction`s
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
fn_to_numeric_cast_any = "warn"
map_err_ignore = "warn"
print_stderr = "warn"
print_stdout = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
base64ct = { version = "1.8.3", features = ["std"] }
bon = "3.10.2"
bytes = "1.12.1"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
chrono = "0.4.45"
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
clap_complete = { version = "4.6.11", default-features = false }
dashmap = "6.2.1"
fromenv = "0.1.0"
futures = "0.3.34"
futures-channel = "0.3.34"
futures-util = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.11.1"
hyper-util = "0.1.21"
insta = "1.49.0"
moka = { version = "0.12.16", features = ["sync"] }
opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry-otlp = { version = "0.33.0", default-features = false }
opentelemetry-proto = "0.33.0"
opentelemetry_sdk = { version = "0.33.0", default-features = false }
parking_lot = "0.12.5"
pastey = "0.2.3"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.3"
rcgen = "0.14.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
syn = { version = "3.0.6", features = ["full"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
wasip3 = { version = "0.9.0", features = ["http-compat"] }
wasm-pkg-client = "0.16.1"
wasmtime = { version = "49.0.2", default-features = false, features = ["anyhow", "component-model-bytes", "parallel-compilation", "pooling-allocator"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-config = "49.0.2"
wasmtime-wasi-http = { version = "49.0.2", default-features = false, features = ["p3"] }
wit-bindgen = { version = "0.62.0", features = ["async-spawn"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["std"] }

# internally referenced crates
omnia = { path = "crates/omnia", version = "0.37.0" }
omnia-cli = { path = "crates/omnia-cli", version = "0.37.0" }
omnia-core = { path = "crates/omnia-core", version = "0.37.0", default-features = false }
omnia-guest-macros = { path = "crates/guest-macros", version = "0.37.0" }
omnia-host-macros = { path = "crates/host-macros", version = "0.37.0" }
omnia-link = { path = "crates/omnia-link", version = "0.37.0" }
omnia-plugin = { path = "crates/omnia-plugin", version = "0.37.0" }
omnia-sdk = { path = "crates/omnia-sdk", version = "0.37.0", default-features = false }
omnia-test = { path = "crates/omnia-test", version = "0.37.0", default-features = false }
omnia-wasi-blobstore = { path = "crates/wasi-blobstore", version = "0.37.0" }
omnia-wasi-config = { path = "crates/wasi-config", version = "0.37.0" }
omnia-wasi-docstore = { path = "crates/wasi-docstore", version = "0.37.0" }
omnia-wasi-http = { path = "crates/wasi-http", version = "0.37.0" }
omnia-wasi-identity = { path = "crates/wasi-identity", version = "0.37.0" }
omnia-wasi-keyvalue = { path = "crates/wasi-keyvalue", version = "0.37.0" }
omnia-wasi-messaging = { path = "crates/wasi-messaging", version = "0.37.0" }
omnia-wasi-model = { path = "crates/wasi-model", version = "0.37.0" }
omnia-wasi-otel = { path = "crates/wasi-otel", version = "0.37.0" }
omnia-wasi-sql = { path = "crates/wasi-sql", version = "0.37.0" }
omnia-wasi-vault = { path = "crates/wasi-vault", version = "0.37.0" }
omnia-wasi-vcs = { path = "crates/wasi-vcs", version = "0.37.0" }
omnia-wasi-websocket = { path = "crates/wasi-websocket", version = "0.37.0" }
test-programs = { path = "crates/test-programs" }

[profile.release]
lto = true
opt-level = "s"
strip = true

# Unoptimized cranelift is ~10x slower.
[profile.dev.package]
cranelift-codegen = { opt-level = 3 }
regalloc2 = { opt-level = 3 }
wasmtime-internal-cranelift = { opt-level = 3 }
