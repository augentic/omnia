# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[config]
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# Full WASM example build for main/scheduled validation.
[tasks.examples]
command = "cargo"
args = ["build", "-p", "examples", "--examples", "--target", "wasm32-wasip2"]

# Smoke-test every example against its README contract (see tests/smoke.rs).
# The test is #[ignore]d so the regular test loop skips it; run it on purpose
# here. Set SMOKE_FILTER to narrow the scenarios.
[tasks.smoke]
workspace = false
dependencies = ["examples"]
script = '''
cargo build -p examples --examples
cargo nextest run -p examples --test smoke --run-ignored ignored-only --no-capture
'''

[tasks.build]
workspace = false
script = '''
name="${1}"
echo "$name"
cargo build -p examples --example "${name}-wasm" --target wasm32-wasip2
'''

[tasks.run]
workspace = false
script = '''
name="${1}"
module="$(printf '%s' "$name" | tr '-' '_')"
ws="$(cargo locate-project --workspace --message-format=plain)"
ws="${ws%/Cargo.toml}"
shift

export RUST_LOG="${RUST_LOG:-info,opentelemetry_sdk=off,omnia_wasi_http=debug,${module}=debug}"

cargo run -p examples --example "$name" -- \
  run "${CARGO_TARGET_DIR:-$ws/target}/wasm32-wasip2/debug/examples/${module}_wasm.wasm" -- "$@"
'''