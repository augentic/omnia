# Host-mediated dynamic linking.
#
# Two guests share one runtime. `router` imports `example:link/echo`, an
# interface outside the runtime's own `wasi:` and `omnia:` namespaces, so the
# host does not satisfy it natively: the runtime core polyfills it onto the
# shared linker and, at startup, serves every guest's linked exports, so
# calling the import dispatches by in-memory routing to `responder`, which
# exports it. Nothing declares the seam — each component says what it
# imports and exports.
#
# The runtime core stays domain-agnostic: the selector sees only the opaque
# interface string `example:link/echo` and opaque guest names.
#
# Build the guests first (see README.md), then run (this path is the runtime's
# compiled-in default, so `--manifest` is optional):
#
#   cargo run --example guest-link -- run

# The file's stem would name each guest (`guest_link_responder_wasm`); the
# router dispatches to `responder`, so the name is given.
[[guest]]
name = "responder"
source.path = "../../target/wasm32-wasip2/debug/examples/guest_link_responder_wasm.wasm"

[[guest]]
name = "router"
source.path = "../../target/wasm32-wasip2/debug/examples/guest_link_router_wasm.wasm"

# In-process is the default transport; named here for clarity. UDS / NATS / QUIC
# slot in behind the same seam in Phase 3 with no guest or dispatch change.
[transport]
default = "in-process"
